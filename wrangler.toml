name = "ishtar-operator"
main = "src/index.ts"
# Matches the proven ishtar-intern runtime pin (wrangler 4.100.0).
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Workers Logs — invocation/exception telemetry (founder reviews in dashboard).
[observability]
enabled = true
  [observability.logs]
  invocation_logs = true

# Workers AI — the ONLY inference surface, routed through the AI Gateway (AI_GATEWAY_ID).
[ai]
binding = "AI"

# The operator brain itself — an Agent IS a Durable Object (Agents SDK).
[[durable_objects.bindings]]
name = "OperatorAgent"
class_name = "OperatorAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OperatorAgent"]

# GA Cloudflare Workflows — the approval-gated build-mission engine (missions.ts).
[[workflows]]
name = "mission-workflow"
binding = "MISSION_WORKFLOW"
class_name = "MissionWorkflow"

# Dynamic Workflows — LIVE (the runtime-generated-mission engine). The operator routes
# missions here when DYNAMIC_MISSIONS="true". Runs on Worker Loaders (Dynamic Workers),
# which is OPEN BETA on the Workers Paid plan — `wrangler deploy` needs the account
# entitlement (request it from Cloudflare; see DEPLOY.md). dry-run does not need it.
[[worker_loaders]]
binding = "LOADER"

[[workflows]]
name = "dynamic-mission-workflow"
binding = "DYNAMIC_WORKFLOWS"
class_name = "DynamicMissionWorkflow"

[vars]
# Operator brain — gpt-oss-120b (OpenAI open-weight, CF-hosted, NO external key).
# Founder-chosen 2026-06-28; verified live FAST: 0.5s/call with reasoning_effort:low
# (MoE + native reasoning levels → honors fast mode, unlike glm-5.2 which was 45-55s).
# Alt brain (one-line swap, also 0.5s): @cf/nvidia/nemotron-3-120b-a12b.
CHAT_MODEL = "@cf/openai/gpt-oss-120b"
# LIGHT tier DISABLED (founder, 2026-06-28: "no light tiers, full tier on everything").
# Empty ⇒ the complexity router is OFF and the FULL brain (gpt-oss-120b) answers EVERY
# turn, trivial or not. Set a model id here only if you ever want cheap-tier routing back.
LIGHT_MODEL = ""
# All env.AI.run routes through this AI Gateway id (dollar spend cap set in the dashboard).
AI_GATEWAY_ID = "datebook"
# Hard daily AI spend ceiling in USD; the operator fail-closes once exceeded
# (runaway-loop money backstop, NOT a usage target). Founder-set 2026-06-28.
DAILY_USD_BUDGET = "20"
# Lock Slack to one workspace/founder (set after install). Empty = any in the installed workspace.
SLACK_TEAM_ID = ""
SLACK_FOUNDER_USER_ID = ""
# Channel the daily brief posts to ("C…"); empty = brief is skipped.
SLACK_BRIEF_CHANNEL = ""
# Dynamic Workflows ON — the operator routes build missions through the runtime-generated
# Workflow engine (mission-dynamic.ts). Requires the Worker Loader beta entitlement to deploy.
DYNAMIC_MISSIONS = "true"

# Secrets (wrangler secret put — never [vars], never logged):
#   ACCESS_KEY            # founder bearer for /admin/*
#   SLACK_SIGNING_SECRET  # verifies POST /slack
#   SLACK_BOT_TOKEN       # xoxb-… for chat.postMessage
#   MCP_TOKEN             # bearer for authed MCP servers (optional)
# Optional MCP endpoints (vars or secrets): MCP_LINEAR_URL, MCP_NOTION_URL, MCP_QMD_URL, MCP_SCANBOX_URL
