name: CI

# Enforces the DEPLOY.md pre-deploy gate on every push/PR: typecheck + tests + a
# wrangler dry-run (bundle + binding validation). dry-run needs no Cloudflare
# credentials and no Worker Loader entitlement, so CI runs fully offline.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dry-run
